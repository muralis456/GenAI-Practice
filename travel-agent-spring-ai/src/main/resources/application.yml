server:
  port: 8081

spring:
  application:
    name: travel-agent-spring-ai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
        temperature: 0.2
        num-predict: 600
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: TravelAgentHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT

travel:
  tavily:
    api-url: https://api.tavily.com/search
    api-key: ${TAVILY_API_KEY:}
  aviation:
    api-url: https://api.aviationstack.com/v1
    api-key: ${AVIATIONSTACK_API_KEY:}

logging:
  level:
    com.example.travel: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
